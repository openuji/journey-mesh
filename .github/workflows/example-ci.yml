name: Examples CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  nextcloud-filesharing:
    name: Nextcloud Filesharing Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Configure pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure stack host
        run: |
          stack_host=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          test -n "$stack_host"
          echo "NEXTCLOUD_WEB_STACK_HOST=$stack_host" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @openuji/journey-executor-playwright exec playwright install --with-deps chromium

      - name: Run Nextcloud filesharing example
        env:
          UJG_EXAMPLE_TIMEOUT_MS: 600000
        run: |
          mkdir -p .tmp/ci-logs
          vmstat -w 5 > .tmp/ci-logs/resources.log &
          resource_pid=$!
          trap 'kill "$resource_pid" 2>/dev/null || true' EXIT
          pnpm --filter @openuji/example-nextcloud-filesharing e2e

      - name: Capture runner diagnostics
        if: always()
        run: |
          mkdir -p .tmp/ci-logs
          free -h > .tmp/ci-logs/memory-after.txt
          sudo -n dmesg --level=err,warn > .tmp/ci-logs/kernel.log 2>&1 || true

      - name: Upload Journey Mesh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-filesharing-journeys
          if-no-files-found: ignore
          path: |
            examples/nextcloud-filesharing/test-results
            examples/nextcloud-filesharing/.tmp/diagnostics
            .tmp/ci-logs

  moodle-usertour-viewport:
    name: Moodle User Tour Viewport Example
    runs-on: ubuntu-latest
    env:
      # Moodle's history is large; over HTTP/2 its clone can reset mid-transfer.
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: http.version
      GIT_CONFIG_VALUE_0: HTTP/1.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Configure pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @openuji/journey-executor-playwright exec playwright install --with-deps chromium

      - name: Run the fix (must pass)
        run: pnpm --filter @openuji/example-moodle-usertour-viewport e2e:fix

      - name: Run the baseline (must reproduce MDL-90255)
        run: |
          if pnpm --filter @openuji/example-moodle-usertour-viewport e2e:baseline; then
            echo "::error::The baseline passed, so MDL-90255 was not reproduced"
            exit 1
          fi
          # A failed build, install or login proves nothing: the only UX error must be the orphaned step's viewport containment.
          jq -e '[.observers[] | select(.kind == "ux") | .errors[]] | length == 1 and (.[0].message | test("^Probe orphaned-step .*expected inViewport"))' \
            examples/moodle-usertour-viewport/test-results/baseline/tests/orphaned-step-viewport/run.json \
            || { echo "::error::The baseline failed, but not on the orphaned step's viewport containment"; exit 1; }

      - name: Compare baseline and fix
        run: |
          # compare exits nonzero because its baseline fails; check the comparison itself instead.
          pnpm --filter @openuji/example-moodle-usertour-viewport compare || true
          jq -e '.comparison.subjects.baseline.ok == false and .comparison.subjects.candidate.ok == true' \
            examples/moodle-usertour-viewport/test-results/comparison/report/report.json

      - name: Upload Journey Mesh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moodle-usertour-viewport-journeys
          if-no-files-found: ignore
          path: examples/moodle-usertour-viewport/test-results
