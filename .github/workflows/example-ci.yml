name: Nextcloud Filesharing CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  nextcloud-filesharing:
    name: Nextcloud Filesharing Example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Configure pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure stack host
        run: |
          stack_host=$(docker network inspect bridge --format '{{(index .IPAM.Config 0).Gateway}}')
          test -n "$stack_host"
          echo "NEXTCLOUD_WEB_STACK_HOST=$stack_host" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @openuji/journey-executor-playwright exec playwright install --with-deps chromium

      - name: Run Nextcloud filesharing example
        env:
          UJG_EXAMPLE_TIMEOUT_MS: 600000
        run: |
          mkdir -p .tmp/ci-logs
          vmstat -w 5 > .tmp/ci-logs/resources.log &
          resource_pid=$!
          trap 'kill "$resource_pid" 2>/dev/null || true' EXIT
          pnpm --filter @openuji/example-nextcloud-filesharing e2e

      - name: Capture runner diagnostics
        if: always()
        run: |
          mkdir -p .tmp/ci-logs
          free -h > .tmp/ci-logs/memory-after.txt
          sudo -n dmesg --level=err,warn > .tmp/ci-logs/kernel.log 2>&1 || true

      - name: Upload Journey Mesh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextcloud-filesharing-journeys
          if-no-files-found: ignore
          path: |
            examples/nextcloud-filesharing/test-results
            examples/nextcloud-filesharing/.tmp/diagnostics
            .tmp/ci-logs
