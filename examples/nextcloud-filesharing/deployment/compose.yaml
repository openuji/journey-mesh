services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ${NEXTCLOUD_STACK_ENV_FILE:?Provided by the Nextcloud stack service}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro

  alice:
    image: ${NEXTCLOUD_IMAGE:?Provided by the Nextcloud stack service}
    env_file:
      - ${NEXTCLOUD_STACK_ENV_FILE:?Provided by the Nextcloud stack service}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NEXTCLOUD_ALICE_PORT:?}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${NEXTCLOUD_ALICE_DB:?}
      POSTGRES_USER: ${NEXTCLOUD_ALICE_DB_USER:?}
      POSTGRES_PASSWORD: ${NEXTCLOUD_ALICE_DB_PASSWORD:?}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_ALICE_HOST:?} ${NEXTCLOUD_ALICE_HOST:?}:${NEXTCLOUD_ALICE_PORT:?} alice localhost 127.0.0.1
      OVERWRITEHOST: ${NEXTCLOUD_ALICE_HOST:?}:${NEXTCLOUD_ALICE_PORT:?}
      OVERWRITEPROTOCOL: http
      OVERWRITECLIURL: ${NEXTCLOUD_ALICE_URL:?}
    volumes:
      - alice_nextcloud:/var/www/html

  bob:
    image: ${NEXTCLOUD_IMAGE:?Provided by the Nextcloud stack service}
    env_file:
      - ${NEXTCLOUD_STACK_ENV_FILE:?Provided by the Nextcloud stack service}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${NEXTCLOUD_BOB_PORT:?}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${NEXTCLOUD_BOB_DB:?}
      POSTGRES_USER: ${NEXTCLOUD_BOB_DB_USER:?}
      POSTGRES_PASSWORD: ${NEXTCLOUD_BOB_DB_PASSWORD:?}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_BOB_HOST:?} ${NEXTCLOUD_BOB_HOST:?}:${NEXTCLOUD_BOB_PORT:?} bob localhost 127.0.0.1
      OVERWRITEHOST: ${NEXTCLOUD_BOB_HOST:?}:${NEXTCLOUD_BOB_PORT:?}
      OVERWRITEPROTOCOL: http
      OVERWRITECLIURL: ${NEXTCLOUD_BOB_URL:?}
    volumes:
      - bob_nextcloud:/var/www/html

volumes:
  postgres:
  alice_nextcloud:
  bob_nextcloud:
